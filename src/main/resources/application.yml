spring:
  application:
    name: moneta-api
  datasource:
    # Credenciais SEMPRE via variáveis de ambiente (ver .env.example)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # Segredo HMAC (mínimo 32 caracteres / 256 bits). NUNCA versionar o valor real.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  security:
    bff-secret: ${BFF_SHARED_SECRET:}
    bff-secret-required: ${BFF_SECRET_REQUIRED:false}
    registration-enabled: ${REGISTRATION_ENABLED:true}
  demo:
    read-only: ${DEMO_API_READ_ONLY:false}
    email: ${DEMO_USER_EMAIL:empresa.demo@example.test}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  compression:
    enabled: true
    mime-types: application/json,text/plain,application/pdf
    min-response-size: 1024
  error:
    include-stacktrace: never
