services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finance}
      DB_USERNAME: ${POSTGRES_USER:-finance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
      BFF_SECRET_REQUIRED: ${BFF_SECRET_REQUIRED:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEMO_API_READ_ONLY: ${DEMO_API_READ_ONLY:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-empresa.demo@example.test}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    networks:
      - finance-net

  dashboard:
    profiles: ["fullstack"]
    build:
      context: ./moneta-dashboard
      dockerfile: Dockerfile
    container_name: moneta-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8080
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-empresa.demo@example.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-readonly}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    networks:
      - finance-net

volumes:
  postgres_data:

networks:
  finance-net:
    driver: bridge
